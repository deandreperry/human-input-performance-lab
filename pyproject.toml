[project]
name = "human-input-performance-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<2.1",
  "pydantic>=2.10,<3", "alembic>=1.14,<2", "python-dotenv>=1,<2"
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27,<1", "ruff>=0.11", "mypy>=1.15"]
postgres = ["psycopg[binary]>=3.2"]
analysis = ["pandas>=2.2", "numpy>=2", "scipy>=1.14", "statsmodels>=0.14", "matplotlib>=3.9", "jupyterlab>=4", "reportlab>=4.2,<5"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "backend", "analysis"]
testpaths = ["backend/tests", "analysis/tests"]

[tool.ruff]
target-version = "py312"
line-length = 105

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pandas.*", "statsmodels.*", "scipy.*", "reportlab.*"]
ignore_missing_imports = true
