name: Verify HIP Lab
on: [push, pull_request]
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.7
          uv sync --locked --extra test --extra analysis
          npm --prefix frontend ci
      - name: Check Python and test research calculations
        run: |
          .venv/bin/ruff check backend analysis scripts
          .venv/bin/mypy backend/hip analysis/hip_analysis
          .venv/bin/python -m pytest -q
      - name: Build and test frontend
        run: |
          npm --prefix frontend run lint
          npm --prefix frontend test
          npm --prefix frontend run build
      - name: Run browser and accessibility tests
        run: |
          (cd frontend && npx playwright install --with-deps chromium)
          .venv/bin/python scripts/browser_tests.py
